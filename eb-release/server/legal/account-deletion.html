<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVADBA.kz - Account Deletion</title>
    <style>
      body { margin: 0; background: #0a1114; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.55; }
      main { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
      h1 { font-size: 34px; margin: 0 0 16px; }
      p, label { color: #c7d0d9; }
      form { display: grid; gap: 14px; margin-top: 22px; }
      input, textarea { width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,.16); background: #10191e; color: #fff; border-radius: 14px; padding: 14px; font: inherit; }
      button { border: 0; border-radius: 16px; background: #4f5dff; color: #fff; padding: 15px 18px; font: inherit; font-weight: 700; cursor: pointer; }
      a { color: #6f7cff; }
      #status { min-height: 24px; color: #bfe8d1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Удаление аккаунта SVADBA.kz</h1>
      <p>В приложении аккаунт можно удалить в кабинете. Если приложения нет под рукой, отправьте запрос здесь. Мы удалим аккаунт и связанные данные, кроме данных, которые обязаны хранить по закону.</p>
      <form id="deleteForm">
        <label>
          Email аккаунта
          <input name="email" type="email" required placeholder="name@example.com" />
        </label>
        <label>
          Комментарий
          <textarea name="reason" rows="4" placeholder="Необязательно"></textarea>
        </label>
        <button type="submit">Отправить запрос</button>
        <p id="status"></p>
      </form>
      <p>Поддержка: <a href="mailto:kukaast95@gmail.com">kukaast95@gmail.com</a></p>
    </main>
    <script>
      document.getElementById('deleteForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const status = document.getElementById('status');
        status.textContent = 'Отправляем...';
        const response = await fetch('/api/account-deletion-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value,
            reason: form.reason.value
          })
        });
        status.textContent = response.ok
          ? 'Запрос принят. Мы обработаем его и свяжемся при необходимости.'
          : 'Не получилось отправить. Проверьте email или напишите в поддержку.';
      });
    </script>
  </body>
</html>
