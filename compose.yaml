services:
  app:
    build:
      context: .
      args:
        EXPO_PUBLIC_API_BASE_URL: https://svadba.kz/api
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATA_DIR: /data
      PORT: 4000
      PUBLIC_BASE_URL: https://svadba.kz
    volumes:
      - svadba-data:/data
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  svadba-data:
  caddy-data:
  caddy-config:
